<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05070f">
  <title>Forgot password | AI Talent Match Pro</title>
  <link rel="icon" href="/static/at-hexagon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--grad:linear-gradient(110deg,#145bb8,#4ddbe8,#145bb8);--panel:rgba(255,255,255,0.035);--border:rgba(255,255,255,0.09)}
    body{background:#05070f;color:#fff;font-family:'Inter',-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
    .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .aurora span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
    .aurora .b1{width:480px;height:480px;top:-160px;left:-120px;background:radial-gradient(circle,rgba(77,159,255,0.5),transparent 70%)}
    .aurora .b2{width:520px;height:520px;bottom:-200px;right:-120px;background:radial-gradient(circle,rgba(63,154,171,0.32),transparent 70%)}
    .card{position:relative;z-index:1;width:100%;max-width:400px;background:linear-gradient(145deg,#0d1330,#080b18);border:1px solid var(--border);border-radius:20px;padding:36px 32px;box-shadow:0 40px 90px rgba(0,0,0,.55)}
    .eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:#7db6ff;margin-bottom:12px}
    h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:9px}
    .sub{font-size:14px;color:rgba(255,255,255,.5);line-height:1.6;margin-bottom:26px}
    label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
    input{width:100%;padding:14px 15px;background:var(--panel);border:1px solid var(--border);border-radius:12px;color:#fff;font-size:14px;outline:none;font-family:inherit;transition:border-color .2s,box-shadow .2s}
    input:focus{border-color:rgba(29,110,245,.7);box-shadow:0 0 0 3px rgba(29,110,245,.16)}
    button{width:100%;margin-top:18px;padding:15px;background:var(--grad);background-size:200% 100%;background-position:left center;border:none;border-radius:4px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s,background-position .4s;box-shadow:0 8px 26px rgba(29,110,245,.35)}
    button:hover:not(:disabled){background-position:right center}
    button:disabled{opacity:.7;cursor:default}
    .msg{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.5;background:rgba(0,214,143,.08);border:1px solid rgba(0,214,143,.25);color:#00d68f}
    .back{display:block;text-align:center;margin-top:20px;font-size:13px;color:#7db6ff;text-decoration:none}
    .back:hover{text-decoration:underline}
  </style>
</head>
<body>
<div class="aurora"><span class="b1"></span><span class="b2"></span></div>
<div class="card">
  <p class="eyebrow">Password reset</p>
  <h1>Forgot your password?</h1>
  <p class="sub">Enter your email and we'll send you a link to set a new one.</p>
  <form id="fpForm">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" placeholder="you@company.com" required autocomplete="email" />
    <button type="submit" id="fpBtn">Send reset link</button>
  </form>
  <div class="msg" id="fpMsg" role="status"></div>
  <a class="back" href="/login">← Back to sign in</a>
</div>
<script>
document.getElementById('fpForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('fpBtn'), msg = document.getElementById('fpMsg');
  btn.disabled = true; btn.textContent = 'Sending…';
  try {
    await fetch('/api/auth/forgot-password', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email: document.getElementById('email').value.trim() })
    });
  } catch(_) {}
  // Always show the same message (no account enumeration)
  msg.textContent = "If that email has an account, a reset link is on its way. Check your inbox (and spam).";
  msg.style.display = 'block';
  btn.style.display = 'none';
});
</script>
  <script src="/static/a11y.js" defer></script>
</body>
</html>
