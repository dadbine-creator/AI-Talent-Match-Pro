<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" text-rendering="geometricPrecision">
  <defs>
    <radialGradient id="logoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4d9fff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Glow behind -->
  <ellipse cx="32" cy="32" rx="28" ry="28" fill="url(#logoGlow)"/>
  <!-- Main square -->
  <rect width="64" height="64" rx="14" fill="#2563eb" filter="url(#glow)"/>
  <!-- AT text — perfectly centered -->
  <text x="32" y="36" font-family="Inter, -apple-system, sans-serif" font-weight="800" font-size="26" fill="white" text-anchor="middle" dominant-baseline="middle" text-rendering="geometricPrecision">AT</text>
</svg>