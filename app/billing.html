<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Billing | AI Talent Match‑Pro</title>

    <!-- Use product theme -->
    <link rel="stylesheet" href="/static/styles.css" />
</head>

<body>

    <!-- TOP NAV -->
    <header class="top-nav">
        <a href="/" class="nav-link">Home</a>
        <a href="/login" class="nav-link">Sign in</a>
    </header>

    <!-- BILLING SECTION -->
    <section id="auth-hero">
        <div class="billing-container fade-up">

            <h1 class="billing-title">Activate Your Trial</h1>
            <p class="auth-subtitle">
                Start your 7-day free trial. A card is required to start it — you're not
                charged until the trial ends, and you can cancel anytime before day 7.
            </p>

            <!-- Card details are collected securely by our payment processor (Paddle) on their
                 hosted checkout — never entered or stored on this site (PCI compliance). -->
            <button class="primary-button billing-btn" onclick="window.location.href='/plans'">
                <span class="icon">🚀</span> Choose a plan &amp; start trial
            </button>

            <p class="auth-note" style="text-align:center; margin-top:12px;">
                You won’t be charged until your trial ends. Payment is handled securely by Paddle.
            </p>

        </div>
    </section>

</body>
</html>
