<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Talent Match Pro</title>

  <!-- Inter Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(to bottom, #00111A, #000000);
      color: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      font-weight: 700;
      color: #00E1FF;
      margin-bottom: 20px;
    }

    p {
      font-size: 20px;
      font-weight: 500;
      color: #F8FAFC;
      margin-bottom: 40px;
    }

    .btn-group {
      display: flex;
      gap: 20px;
    }

    .btn {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    .btn-demo {
      background-color: #00E1FF;
      color: #000;
    }

    .btn-demo:hover {
      background-color: #00c0dd;
    }

    .btn-learn {
      background-color: #111;
      color: #F8FAFC;
      border: 1px solid #00E1FF;
    }

    .btn-learn:hover {
      background-color: #222;
    }
  </style>
</head>

<body>
  <h1>AI Talent Match Pro</h1>
  <p>Hire faster. Stay in control.</p>

  <div class="btn-group">
    <button class="btn btn-demo">Get a demo</button>
    <button class="btn btn-learn">See how it works</button>
  </div>
  <script src="/static/a11y.js" defer></script>
</body>
</html>
