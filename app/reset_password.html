<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05070f">
  <title>Reset password | AI Talent Match Pro</title>
  <link rel="icon" href="/static/at-hexagon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--grad:linear-gradient(120deg,#4d9fff 0%,#8b5cf6 50%,#ec4899 100%);--panel:rgba(255,255,255,0.035);--border:rgba(255,255,255,0.09)}
    body{background:#05070f;color:#fff;font-family:'Inter',-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden}
    .aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
    .aurora span{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5}
    .aurora .b1{width:480px;height:480px;top:-160px;left:-120px;background:radial-gradient(circle,rgba(77,159,255,0.5),transparent 70%)}
    .aurora .b2{width:520px;height:520px;bottom:-200px;right:-120px;background:radial-gradient(circle,rgba(236,72,153,0.38),transparent 70%)}
    .card{position:relative;z-index:1;width:100%;max-width:400px;background:linear-gradient(145deg,#0d1330,#080b18);border:1px solid var(--border);border-radius:20px;padding:36px 32px;box-shadow:0 40px 90px rgba(0,0,0,.55)}
    .eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.14em;color:#7db6ff;margin-bottom:12px}
    h1{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-bottom:9px}
    .sub{font-size:14px;color:rgba(255,255,255,.5);line-height:1.6;margin-bottom:26px}
    label{display:block;font-size:12px;font-weight:600;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 7px}
    input{width:100%;padding:14px 15px;background:var(--panel);border:1px solid var(--border);border-radius:12px;color:#fff;font-size:14px;outline:none;font-family:inherit;transition:border-color .2s,box-shadow .2s}
    input:focus{border-color:rgba(139,92,246,.6);box-shadow:0 0 0 3px rgba(139,92,246,.12)}
    button{width:100%;margin-top:20px;padding:15px;background:var(--grad);background-size:180% 180%;border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s,background-position .4s;box-shadow:0 8px 26px rgba(99,102,241,.35)}
    button:hover:not(:disabled){transform:translateY(-1px);background-position:right center}
    button:disabled{opacity:.7;cursor:default}
    .msg{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.5}
    .msg--err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#f87171}
    .msg--ok{background:rgba(0,214,143,.08);border:1px solid rgba(0,214,143,.25);color:#00d68f}
    .back{display:block;text-align:center;margin-top:20px;font-size:13px;color:#7db6ff;text-decoration:none}
    .back:hover{text-decoration:underline}
  </style>
</head>
<body>
<div class="aurora"><span class="b1"></span><span class="b2"></span></div>
<div class="card">
  <p class="eyebrow">Password reset</p>
  <h1>Set a new password</h1>
  <p class="sub">Choose a new password for your account.</p>
  <form id="rpForm">
    <label for="pw">New password</label>
    <input type="password" id="pw" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" />
    <label for="pw2">Confirm password</label>
    <input type="password" id="pw2" placeholder="Repeat your password" required autocomplete="new-password" />
    <button type="submit" id="rpBtn">Update password</button>
  </form>
  <div class="msg" id="rpMsg" role="alert"></div>
  <a class="back" href="/login">← Back to sign in</a>
</div>
<script>
const token = new URLSearchParams(location.search).get('token') || '';
const msg = document.getElementById('rpMsg');
function show(text, ok){ msg.className = 'msg ' + (ok ? 'msg--ok' : 'msg--err'); msg.textContent = text; msg.style.display = 'block'; }
if (!token) show('This reset link is missing its token. Request a new one from the sign-in page.', false);
document.getElementById('rpForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = document.getElementById('pw').value, pw2 = document.getElementById('pw2').value;
  if (pw.length < 8) return show('Password must be at least 8 characters.', false);
  if (pw !== pw2)   return show("Passwords don't match.", false);
  const btn = document.getElementById('rpBtn'); btn.disabled = true; btn.textContent = 'Updating…';
  try {
    const res = await fetch('/api/auth/reset-password', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ token, password: pw })
    });
    let data = {}; try { data = await res.json(); } catch(_) {}
    if (res.ok && data.ok) {
      document.getElementById('rpForm').style.display = 'none';
      show('Password updated. Redirecting to sign in…', true);
      setTimeout(() => location.href = '/login', 1600);
    } else {
      show(data.detail || data.error || 'Could not reset password.', false);
      btn.disabled = false; btn.textContent = 'Update password';
    }
  } catch(_) {
    show('Connection error — please try again.', false);
    btn.disabled = false; btn.textContent = 'Update password';
  }
});
</script>
</body>
</html>
